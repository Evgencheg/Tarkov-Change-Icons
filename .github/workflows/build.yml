name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build src/ChangeIcons/ChangeIcons.csproj -c Release

      - name: Package
        run: |
          mkdir -p dist/SPT_Runtime/user/mods/ChangeIcons
          cp src/ChangeIcons/bin/Release/net10.0/ChangeIcons.dll dist/SPT_Runtime/user/mods/ChangeIcons/
          cp LICENSE dist/SPT_Runtime/user/mods/ChangeIcons/LICENSE
          cd dist && zip -r ../ChangeIcons.zip SPT_Runtime

      - uses: actions/upload-artifact@v4
        with:
          name: ChangeIcons
          path: dist

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChangeIcons.zip
          generate_release_notes: true
